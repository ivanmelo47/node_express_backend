services:
  app:
    build: .
    container_name: node_express_app
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-node_express}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_DIALECT=mariadb
      - WHITELISTED_IPS=${WHITELISTED_IPS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Mexico_City}
      - SYSTEM_USER=${SYSTEM_USER}
      - SYSTEM_PASSWORD=${SYSTEM_PASSWORD}
      - SYSTEM_MASTER_TOKEN=${SYSTEM_MASTER_TOKEN}
      - SYSTEM_MODULE_ENABLED=${SYSTEM_MODULE_ENABLED}
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
      - ./public:/app/public
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: mariadb:10.6
    container_name: node_express_db
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MARIADB_DATABASE=${DB_DATABASE:-node_express}
      # If you want a specific non-root user, uncomment these:
      # - MARIADB_USER=${DB_USERNAME:-user}
      # - MARIADB_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: node_express_pma
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    ports:
      - "8090:80"
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: node_express_mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
