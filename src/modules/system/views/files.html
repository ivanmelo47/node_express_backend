    <div class="sidebar">
        <div class="logo">
             <svg class="icon" style="color: var(--accent); margin-right: 8px;"><use href="#icon-terminal"></use></svg> SYS.MANAGER
        </div>
        <div class="nav-item" onclick="window.location.href='/api/system/dashboard'">
             <svg class="icon"><use href="#icon-dashboard"></use></svg> Dashboard
        </div>
        <div class="nav-item active">
             <svg class="icon"><use href="#icon-folder-open"></use></svg> Archivos
        </div>
    </div>

    <div class="main">
        <!-- Global Header -->
        <div class="toolbar">
            <div style="font-weight: bold; font-size: 1.1rem;">System File Manager</div>
            <button class="btn btn-logout" onclick="window.location.href = window.location.protocol + '//logout:logout@' + window.location.host + '/api/system'">
                <svg class="icon"><use href="#icon-logout"></use></svg> Cerrar Sesión
            </button>
        </div>

        <!-- File Actions Toolbar -->
        <div style="padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--border); background-color: rgba(26, 27, 38, 0.5); display: flex; align-items: center; justify-content: space-between;">
            <div id="breadcrumb" class="breadcrumb" style="flex: 1;">
                <span class="breadcrumb-item" onclick="loadPath('')">root</span>
            </div>
            <div style="display: flex; gap: 0.8rem;">
                <button class="btn btn-secondary" onclick="refreshCurrentPath()" title="Refrescar">
                    <svg class="icon"><use href="#icon-refresh"></use></svg>
                </button>
                <button class="btn btn-primary" onclick="createFolderPrompt()">
                    <svg class="icon"><use href="#icon-folder-plus"></use></svg> Nueva Carpeta
                </button>
            </div>
        </div>

        <div id="file-grid" class="file-grid">
            <!-- Items loaded via JS -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 0.8rem;">
                    <svg class="icon" style="color: var(--accent);"><use href="#icon-file-code"></use></svg>
                    <span id="edit-filename" style="font-weight: bold;">filename.ts</span>
                </div>
                
                <div class="editor-toolbar">
                    <button class="tool-btn" onclick="toggleTheme()" title="Cambiar Tema">
                        <svg class="icon"><use href="#icon-palette"></use></svg>
                    </button>
                    <button class="tool-btn" onclick="zoomEditor(-1)" title="Alejar">
                        <svg class="icon"><use href="#icon-zoom-out"></use></svg>
                    </button>
                    <button class="tool-btn" onclick="zoomEditor(1)" title="Acercar">
                        <svg class="icon"><use href="#icon-zoom-in"></use></svg>
                    </button>
                    <div style="width: 1px; height: 20px; background: var(--border); margin: 0 0.5rem;"></div>
                    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button class="btn btn-primary" onclick="saveFile()">
                        <svg class="icon"><use href="#icon-save"></use></svg> Guardar
                    </button>
                </div>
            </div>
            
            <div class="editor-container" id="editor-container">
                <div class="editor-gutter" id="editor-gutter">1</div>
                <div class="editor-area" id="editor-area">
                    <pre class="editor-layer" id="editor-highlight"><code id="editor-code"></code></pre>
                    <textarea class="editor-layer" id="file-editor" spellcheck="false" oninput="updateEditor()" onscroll="syncScroll()" onkeydown="handleKey(event)"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu">
        <div class="context-item delete" onclick="deleteSelectedItem()">
             <svg class="icon"><use href="#icon-trash"></use></svg> Eliminar
        </div>
    </div>

    <!-- Linked Static Assets -->
    <script src="/public/js/file-manager.js"></script>
</body>
</html>
